<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#F5EDE3"/>

  <!-- Clock icon -->
  <circle cx="400" cy="220" r="80" fill="none" stroke="#7F1F12" stroke-width="5"/>
  <circle cx="400" cy="220" r="5" fill="#7F1F12"/>
  <!-- Hour hand -->
  <line x1="400" y1="220" x2="400" y2="170" stroke="#7F1F12" stroke-width="5" stroke-linecap="round"/>
  <!-- Minute hand -->
  <line x1="400" y1="220" x2="435" y2="200" stroke="#7F1F12" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Clock tick marks -->
  <line x1="400" y1="145" x2="400" y2="155" stroke="#7F1F12" stroke-width="3"/>
  <line x1="400" y1="285" x2="400" y2="295" stroke="#7F1F12" stroke-width="3"/>
  <line x1="325" y1="220" x2="315" y2="220" stroke="#7F1F12" stroke-width="3"/>
  <line x1="475" y1="220" x2="485" y2="220" stroke="#7F1F12" stroke-width="3"/>

  <!-- Day label -->
  <text x="400" y="380" font-family="Georgia, serif" font-size="56" fill="#7F1F12" text-anchor="middle" font-weight="bold">Day 1</text>

  <!-- Countdown text -->
  <text x="400" y="430" font-family="Georgia, serif" font-size="28" fill="#7F1F12" text-anchor="middle" opacity="0.7">4 days to go</text>

  <!-- Decorative line -->
  <line x1="300" y1="460" x2="500" y2="460" stroke="#7F1F12" stroke-width="1.5" opacity="0.4"/>
</svg>
