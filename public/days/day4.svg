<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#F5EDE3"/>

  <!-- Waving hand -->
  <!-- Palm -->
  <ellipse cx="400" cy="215" rx="45" ry="55" fill="#7F1F12" opacity="0.8" transform="rotate(-10 400 215)"/>
  <!-- Fingers -->
  <rect x="370" y="145" width="14" height="50" rx="7" fill="#7F1F12" opacity="0.75" transform="rotate(-15 377 170)"/>
  <rect x="390" y="135" width="14" height="55" rx="7" fill="#7F1F12" opacity="0.8" transform="rotate(-5 397 162)"/>
  <rect x="410" y="138" width="14" height="52" rx="7" fill="#7F1F12" opacity="0.75" transform="rotate(5 417 164)"/>
  <rect x="428" y="148" width="13" height="45" rx="6.5" fill="#7F1F12" opacity="0.7" transform="rotate(15 434 170)"/>
  <!-- Thumb -->
  <rect x="348" y="195" width="13" height="35" rx="6.5" fill="#7F1F12" opacity="0.7" transform="rotate(-50 354 212)"/>

  <!-- Motion lines -->
  <line x1="310" y1="170" x2="290" y2="160" stroke="#7F1F12" stroke-width="2.5" stroke-linecap="round" opacity="0.3"/>
  <line x1="305" y1="200" x2="280" y2="200" stroke="#7F1F12" stroke-width="2.5" stroke-linecap="round" opacity="0.25"/>
  <line x1="310" y1="230" x2="288" y2="240" stroke="#7F1F12" stroke-width="2.5" stroke-linecap="round" opacity="0.2"/>
  <line x1="490" y1="170" x2="510" y2="160" stroke="#7F1F12" stroke-width="2.5" stroke-linecap="round" opacity="0.3"/>
  <line x1="495" y1="200" x2="520" y2="200" stroke="#7F1F12" stroke-width="2.5" stroke-linecap="round" opacity="0.25"/>
  <line x1="490" y1="230" x2="512" y2="240" stroke="#7F1F12" stroke-width="2.5" stroke-linecap="round" opacity="0.2"/>

  <!-- Day label -->
  <text x="400" y="380" font-family="Georgia, serif" font-size="56" fill="#7F1F12" text-anchor="middle" font-weight="bold">Day 4</text>

  <!-- Countdown text -->
  <text x="400" y="430" font-family="Georgia, serif" font-size="28" fill="#7F1F12" text-anchor="middle" opacity="0.7">Last day</text>

  <!-- Decorative line -->
  <line x1="300" y1="460" x2="500" y2="460" stroke="#7F1F12" stroke-width="1.5" opacity="0.4"/>
</svg>
