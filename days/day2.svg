<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#F5EDE3"/>

  <!-- Calendar icon -->
  <rect x="335" y="150" width="130" height="140" rx="10" fill="none" stroke="#7F1F12" stroke-width="4.5"/>
  <!-- Calendar top bar -->
  <rect x="335" y="150" width="130" height="35" rx="10" fill="#7F1F12"/>
  <rect x="335" y="170" width="130" height="15" fill="#7F1F12"/>
  <!-- Calendar rings -->
  <line x1="370" y1="140" x2="370" y2="160" stroke="#7F1F12" stroke-width="4" stroke-linecap="round"/>
  <line x1="430" y1="140" x2="430" y2="160" stroke="#7F1F12" stroke-width="4" stroke-linecap="round"/>
  <!-- Calendar grid dots -->
  <circle cx="365" cy="215" r="4" fill="#7F1F12" opacity="0.3"/>
  <circle cx="400" cy="215" r="4" fill="#7F1F12" opacity="0.3"/>
  <circle cx="435" cy="215" r="4" fill="#7F1F12" opacity="0.3"/>
  <circle cx="365" cy="245" r="4" fill="#7F1F12" opacity="0.3"/>
  <circle cx="400" cy="245" r="6" fill="#7F1F12" opacity="0.8"/>
  <circle cx="435" cy="245" r="4" fill="#7F1F12" opacity="0.3"/>
  <circle cx="365" cy="275" r="4" fill="#7F1F12" opacity="0.15"/>
  <circle cx="400" cy="275" r="4" fill="#7F1F12" opacity="0.15"/>
  <circle cx="435" cy="275" r="4" fill="#7F1F12" opacity="0.15"/>

  <!-- Day label -->
  <text x="400" y="380" font-family="Georgia, serif" font-size="56" fill="#7F1F12" text-anchor="middle" font-weight="bold">Day 2</text>

  <!-- Countdown text -->
  <text x="400" y="430" font-family="Georgia, serif" font-size="28" fill="#7F1F12" text-anchor="middle" opacity="0.7">3 days to go</text>

  <!-- Decorative line -->
  <line x1="300" y1="460" x2="500" y2="460" stroke="#7F1F12" stroke-width="1.5" opacity="0.4"/>
</svg>
